<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js Car Game</title>
    <!-- Babylon.js and Havok are pinned as a tested pair: the Babylon CDN always ships the newest builds,
         and Havok 1.3.12 changed how angular position motors behave (see AttachAxleToFrame in
         game/babylon-game.js). Bump both versions together and re-test the car when updating. -->
    <script src="https://unpkg.com/babylonjs@9.25.0/babylon.js"></script>
    <script src="https://unpkg.com/babylonjs-loaders@9.25.0/babylonjs.loaders.min.js"></script>
    <script src="https://unpkg.com/@babylonjs/havok@1.3.14/lib/umd/HavokPhysics_umd.js"></script>
    <script src="https://unpkg.com/babylonjs-gui@9.25.0/babylon.gui.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="./index.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/info-panel.css">
    <link rel="stylesheet" href="css/mobile-controls.css">
    <link rel="stylesheet" href="css/desktop-controls.css">
    <link rel="stylesheet" href="css/fps-counter.css">
</head>

<body>
    <div id="app">
        <!-- Info Panel Component -->
        <info-panel :speed="speed" :position="position" :rotation="rotation" :direction="direction"
            :collisions="collisions" :knocked-boxes="knockedBoxes" :max-speed="maxSpeed" :race-time="raceTime"
            :is-racing="isRacing" :is-touch-device="isTouchDevice">
        </info-panel>

        <!-- FPS Counter Component -->
        <fps-counter :fps="fps"></fps-counter>

        <!-- Canvas -->
        <canvas id="renderCanvas"></canvas>

        <!-- Desktop Controls Component -->
        <desktop-controls :is-touch-device="isTouchDevice">
        </desktop-controls>

        <!-- Mobile Controls Component -->
        <mobile-controls :is-touch-device="isTouchDevice" @update-touch-controls="onTouchControlsUpdate"
            @reset-game="onMobileReset" @toggle-view="onToggleView">
        </mobile-controls>
    </div>
</body>

</html>
